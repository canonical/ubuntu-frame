name: Close snap channel

on:
  workflow_call:
    inputs:
      channel:
        description: Snap channel to close
        type: string
        required: true
      name:
        description: Snap name; defaults to the caller repository name
        type: string
        default: ''
      snapcraft-channel:
        type: string
        default: stable
      continue-on-error:
        type: boolean
        default: true
    secrets:
      snapcraft-token:
        required: false

permissions: {}

jobs:
  close:
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
    - name: Close obsolete channel
      uses: canonical/actions/close-snap@78e8dd5f693653767f2c60c4a6a421a1ebed35af # release @ 2025.06.05
      continue-on-error: ${{ inputs.continue-on-error }}
      with:
        name: ${{ inputs.name }}
        channel: ${{ inputs.channel }}
        snapcraft-channel: ${{ inputs.snapcraft-channel }}
        snapcraft-token: ${{ secrets.snapcraft-token }}
