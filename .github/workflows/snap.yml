name: Snap

on:
  merge_group:
    types: [checks_requested]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  Snap:
    permissions:
      contents: read

    strategy:
      matrix:
        platform: [amd64, arm64]
      fail-fast: false

    uses: ./.github/workflows/reusable-snap.yml
    with:
      architecture: ${{ matrix.platform }}
      checkout-lfs: true
      prepare: |
        sed -i 's@mir-team/release@mir-team/dev@' snap/snapcraft.yaml
        sed -i 's@rev-list --count@rev-parse --short@' snap/snapcraft.yaml
      publish: ${{ github.event_name == 'pull_request' && github.repository == github.event.pull_request.head.repo.full_name }}
      publish-channel: 26/edge/pr${{ github.event.number }}
    secrets:
      snapcraft-token: ${{ secrets.SNAPCRAFT_TOKEN }}
