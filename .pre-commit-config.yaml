# Recommended workflow:
# - `git add --verbose --patch` to stage changes
# - `git commit` to commit them
# - rinse and repeat, if pre-commit wants / applied changes

exclude: ^docs/(\..*|Makefile|conf\.py)

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-added-large-files

- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: 06a39750ec31860bb44f2acf67182c40016cd1e7  # frozen: v1.32.0
  hooks:
  - id: zizmor
    args:
    - --fix

- repo: https://github.com/executablebooks/mdformat
  rev: 82912cdaea4fb830f751504486a7879c70526547  # frozen: 1.0.0
  hooks:
  - id: mdformat
    additional_dependencies:
    - mdformat-black
    - mdformat-beautysh
    - mdformat-gfm
    - mdformat-myst
    - setuptools # Necessary until beautysh fix their stuff, see: https://github.com/hukkin/mdformat/issues/442

- repo: https://github.com/jackdewinter/pymarkdown
  rev: 4b13b0235c9921966e8093b46948041075c80460  # frozen: v0.9.42
  hooks:
  - id: pymarkdown
    alias: pymarkdown-fix
    name: PyMarkdown (autofix)
    args:
    - --config=docs/.sphinx/.pymarkdown.json
    - fix
  - id: pymarkdown
    alias: pymarkdown-scan
    name: PyMarkdown (scan)
    args:
    - --config=docs/.sphinx/.pymarkdown.json
    - scan
